# Local development. Start with: SPRING_PROFILES_ACTIVE=dev
# Requires Ollama on this machine: ollama serve && ollama pull qwen3.5:4b
app:
  llm:
    base-url: ${LLM_BASE_URL:http://127.0.0.1:11434/v1}
    model: ${LLM_MODEL:qwen3.5:4b}
    api-key: ${LLM_API_KEY:}
    think: ${LLM_THINK:false}
    # Ollama's OpenAI shim ignores think and fills the context with reasoning,
    # which comes back as an empty answer. The native chat API honors think.
    ollama-native: ${LLM_OLLAMA_NATIVE:true}
